<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart – Arivon Apparel</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    
    .cart-page-wrap {
      
      display: flex;
      flex-direction: column;
      height: calc(100vh - 61px);
    }
    .cart-page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid #333;
      letter-spacing: 2px;
      font-size: 13px;
    }
    .cart-page-items {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .cart-page-items::-webkit-scrollbar { width: 4px; }
    .cart-page-items::-webkit-scrollbar-track { background: #111; }
    .cart-page-items::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
    .cart-page-footer {
      border-top: 1px solid #333;
      padding: 24px 40px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 500px;
    }
    .cart-page-total {
      font-size: 16px;
      letter-spacing: 1px;
      font-weight: 600;
    }
    .cart-checkout-btn {
      padding: 10px;
      background: white;
      color: black;
      border: none;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      font-weight: 600;
      transition: background 0.2s, transform 0.2s;
    }
    .cart-checkout-btn:hover {
      background: #ddd;
      transform: scale(1.02);
    }
    .cart-item { padding: 14px 40px; }
    .cart-empty {
      text-align: center;
      color: #666;
      margin-top: 80px;
      font-size: 13px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<header class="navbar">
  <a href="index.html" class="text-logo">ARIVON APPAREL</a>

  <nav class="nav-links">
    <a href="shop.html">SHOP</a>
    <a href="collections.html">COLLECTIONS</a>
    <a href="about.html">ABOUT</a>
    <a href="policy.html">POLICY</a>
  </nav>

  <a href="cart.html" class="cart-link">
    CART <span id="cart-count" class="cart-count">(0)</span>
  </a>
</header>

  <div id="menu-overlay" class="menu-overlay" onclick="closeMenu()"></div>
  <div id="menu-panel" class="menu-panel">
    <button class="menu-close" onclick="closeMenu()">✕</button>
    <nav class="menu-nav">
      <a href="index.html">HOME</a>
      <a href="shop.html">SHOP</a>
      <a href="about.html">ABOUT</a>
      <a href="policy.html">POLICY</a>
    </nav>
  </div>

  <div class="cart-page-wrap">
    <div class="cart-page-header">
      <span>YOUR CART</span>
    </div>
    <div class="cart-page-items" id="cartContainer"></div>
    <div class="cart-page-footer">
      <div class="cart-page-total" id="cartTotal">Total: $0</div>
      <button class="cart-checkout-btn" onclick="stripeCheckout()">CHECKOUT →</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    renderCartPage();

    function openMenu() {
      document.getElementById('menu-panel').classList.add('open');
      document.getElementById('menu-overlay').classList.add('active');
    }
    function closeMenu() {
      document.getElementById('menu-panel').classList.remove('open');
      document.getElementById('menu-overlay').classList.remove('active');
    }

    async function stripeCheckout() {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      let selected = cart.filter(item => item.selected);
      if (selected.length === 0) { alert('No items selected'); return; }
      const res = await fetch('/.netlify/functions/create-checkout', {
        method: 'POST',
        body: JSON.stringify({ items: selected })
      });
      const { url } = await res.json();
      window.location.href = url;
    }

    window.addEventListener('DOMContentLoaded', () => {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      let countEl = document.getElementById('cart-count');
      if (countEl && cart.length > 0) countEl.textContent = `(${cart.length})`;
    });
  </script>

</body>
</html>
