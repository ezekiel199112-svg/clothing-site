<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
  <title>ARIVON APPAREL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <a href="index.html" class="text-logo">ARIVON APPAREL</a>

  <nav class="nav-links">
    <a href="shop.html">SHOP</a>
    <a href="collections.html">COLLECTIONS</a>
    <a href="about.html">ABOUT</a>
    <a href="policy.html">POLICY</a>
  </nav>

  <a href="cart.html" class="cart-link">
    CART <span id="cart-count" class="cart-count">(0)</span>
  </a>
</header>

<section class="hero">
  <p class="hero-eyebrow">ARIVON APPAREL — NOTHING'S DROPPED YET</p>
  <h1>BE FIRST WHEN IT RIPS OPEN</h1>
  <p>Something's coming. Drop your email and we'll hit you the second it's live.</p>

  <form name="coming-soon" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="hero-email-form" action="/thank-you.html">
    <input type="hidden" name="form-name" value="coming-soon">
    <p style="display:none">
      <label>Don't fill this out: <input name="bot-field"></label>
    </p>
    <input type="email" name="email" class="email-input" placeholder="ENTER YOUR EMAIL" required>
    <button type="submit" class="email-btn">NOTIFY ME</button>
  </form>
</section>

  <footer>
    <p>© 2026 ARIVON APPAREL</p>
  </footer>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      let countEl = document.getElementById('cart-count');
      if (countEl && cart.length > 0) countEl.textContent = `(${cart.length})`;
    });
  </script>

</body>
</html>
