<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
  <title>ARIVON APPAREL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <button class="hamburger" onclick="openMenu()">
      <span></span><span></span><span></span>
    </button>

    <div class="ticker-wrap">
      <div class="ticker">
      <span>FREE SHIPPING ON ORDERS ABOVE $150</span>
      <span>MADE TO ORDER — SHIPS IN 7–14 DAYS</span>
      <span>FREE SHIPPING ON ORDERS ABOVE $150</span>
      <span>MADE TO ORDER — SHIPS IN 7–14 DAYS</span>
      <span>FREE SHIPPING ON ORDERS ABOVE $150</span>
      <span>MADE TO ORDER — SHIPS IN 7–14 DAYS</span>
      </div>
    </div>

    <a href="index.html" class="nav-logo-link">
      <img src="images/ChatGPT Image Jun 6, 2026, 10_06_43 PM (1).png" class="nav-logo">
    </a>

    <a href="cart.html" class="cart-link">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span id="cart-count" class="cart-count"></span>
    </a>
  </header>

  <div id="menu-overlay" class="menu-overlay" onclick="closeMenu()"></div>
  <div id="menu-panel" class="menu-panel">
    <button class="menu-close" onclick="closeMenu()">✕</button>
    <nav class="menu-nav">
      <a href="index.html">HOME</a>
      <a href="shop.html">SHOP</a>
      <a href="about.html">ABOUT</a>
      <a href="policy.html">POLICY</a>
    </nav>
  </div>

  <section class="hero">
    <p class="hero-eyebrow"></p>
    <h1>ARIVON<br>APPAREL</h1>
    <p>Streetwear / Y2K / Grunge</p>
    <form name="email-signup" method="POST" data-netlify="true" action="/success.html" class="hero-email-form">
      <input type="hidden" name="form-name" value="email-signup">
      <input type="email" name="email" placeholder="YOUR EMAIL" required class="email-input">
      <button type="submit" class="email-btn">NOTIFY ME</button>
    </form>
    <a href="shop.html"><button>SHOP NOW</button></a>
  </section>

  <footer>
    <p>© 2026 ARIVON APPAREL</p>
  </footer>

  <script>
    function openMenu() {
      document.getElementById('menu-panel').classList.add('open');
      document.getElementById('menu-overlay').classList.add('active');
    }
    function closeMenu() {
      document.getElementById('menu-panel').classList.remove('open');
      document.getElementById('menu-overlay').classList.remove('active');
    }
    window.addEventListener('DOMContentLoaded', () => {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      let countEl = document.getElementById('cart-count');
      if (countEl && cart.length > 0) countEl.textContent = `(${cart.length})`;
    });
  </script>

</body>
</html>
